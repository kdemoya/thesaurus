# Ordered selection for alternative licenses. New/unaccepted licenses fail the build.
accepted = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "BSL-1.0", "Unicode-3.0", "CC0-1.0", "CDLA-Permissive-2.0",
  "MPL-2.0", "Apache-2.0 WITH LLVM-exception", "Unlicense", "MIT-0", "0BSD",
]
ignore-dev-dependencies = true
# Retain build dependencies too: generated code/proc macros can enter the artifact.
ignore-build-dependencies = false
workarounds = ["ring"]
