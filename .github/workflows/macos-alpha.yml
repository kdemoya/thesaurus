name: Build local macOS alpha

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-alpha:
    name: Apple Silicon review installer
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned build tools
        run: ./scripts/bootstrap.sh
      - name: Install packaging Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check signing and packaging safeguards
        run: |
          python3 scripts/test-macos-distribution.py
          python3 scripts/test-macos-packaging.py
      - name: Build and verify local alpha
        run: python3 scripts/package-macos.py
      - name: Save review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thesaurus-arm64-local-alpha
          path: target/macos-alpha/local/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
