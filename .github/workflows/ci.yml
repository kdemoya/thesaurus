name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan source history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: |
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .'

  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned build tools
        run: ./scripts/bootstrap.sh
      - name: Install packaging Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check formatting
        run: ./scripts/cargo.sh fmt --all -- --check
      - name: Check macOS distribution safeguards
        run: |
          python3 scripts/test-macos-distribution.py
          python3 scripts/test-macos-packaging.py
      - name: Check interface behavior
        run: |
          RUSTUP_HOME="$PWD/.tools/rustup" CARGO_HOME="$PWD/.tools/cargo" .tools/cargo/bin/rustc --edition 2024 --test apps/ui/src/bragbook_review_state.rs -o "$RUNNER_TEMP/thesaurus-review-state-tests"
          "$RUNNER_TEMP/thesaurus-review-state-tests"
          node scripts/test-dialogs.mjs
          node --test scripts/test-recovery.cjs
      - name: Test service, shared crates, and plugin examples
        run: >-
          ./scripts/cargo.sh test --locked --all-targets
          -p thesaurus-contracts -p thesaurus-client -p thesaurus-mcp
          -p thesaurus-plugin-sdk -p thesaurus-core -p thesaurus
      - name: Build optimized web interface
        run: ./scripts/build-web.sh --release --locked
      - name: Test desktop shell
        env:
          # Unit tests exercise the shell without packaging generated sidecars.
          # The release pipeline must build and verify the actual resources.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: ./scripts/cargo.sh test --locked -p thesaurus-desktop
