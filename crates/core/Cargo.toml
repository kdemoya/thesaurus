[package]
name = "thesaurus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
thesaurus-contracts.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
toml = "0.8"
directories = "6"
regex = "1"
rand = "0.8"
fs2 = "0.4"
libc = "0.2"

rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
mcp-http = { package = "reqwest", version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }

futures-util = "0.3"
async-stream = "0.3"
sse-stream = "0.2.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
