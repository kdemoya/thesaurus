[package]
name = "thesaurus-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thesaurus-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "Location", "History", "Storage", "EventSource", "MessageEvent", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement"] }
console_error_panic_hook = "0.1"
